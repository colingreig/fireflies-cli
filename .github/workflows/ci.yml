name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - id: install
        run: npm ci --ignore-scripts
      - id: typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - id: tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test
      - id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
      - id: audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm audit --audit-level=low
      - name: Report every failure
        if: ${{ !cancelled() }}
        env:
          INSTALL: ${{ steps.install.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
        run: |
          failed=0
          for check in INSTALL TYPECHECK TESTS BUILD AUDIT; do
            outcome="${!check}"
            echo "$check: $outcome" >> "$GITHUB_STEP_SUMMARY"
            if [ "$outcome" = failure ]; then
              failed=1
            fi
          done
          exit "$failed"
